# 정적 파일을 빌드 없이 그대로 GitHub Pages에 배포
# 최초 1회: 리포 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 지정해야 함
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포할 파일만 모으기
        run: |
          mkdir -p _site
          cp index.html style.css app.js tts.js stories.js _site/
          # 자체 호스팅 모델이 있으면 함께 올림 (파일당 100MB 제한)
          if [ -d assets ]; then cp -r assets _site/; fi
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
