<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>이야기 극장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>이야기 극장</h1>
    <p id="engine" class="engine" aria-live="polite">음성 엔진 불러오는 중</p>
  </header>

  <div class="layout">
    <aside class="shelf">
      <h2>이야기 고르기</h2>
      <ul id="storyList" class="story-list"></ul>
      <button id="openEditor" class="ghost">내 이야기 넣기</button>
    </aside>

    <main class="stage">
      <article class="page">
        <header class="page-head">
          <div id="scene" class="scene" role="img"></div>
          <p id="storySource" class="source"></p>
          <h2 id="storyTitle" class="title"></h2>
          <p id="castLegend" class="legend" aria-label="등장인물"></p>
          <details id="voices" class="voices">
            <summary>목소리 바꾸기</summary>
            <div id="castList" class="cast-list"></div>
          </details>
        </header>

        <div id="book" class="book"></div>

        <section id="askBox" class="ask" aria-label="생각해 볼까요">
          <h3>생각해 볼까요?</h3>
          <div id="ask"></div>
        </section>

        <p id="hint" class="hint-line" aria-live="polite"></p>
      </article>
    </main>
  </div>

  <nav class="transport" aria-label="재생 조작">
    <button id="prevBtn" class="tbtn" aria-label="이전 문장">◀◀</button>
    <button id="playBtn" class="tbtn play" aria-label="재생" disabled>▶</button>
    <button id="nextBtn" class="tbtn" aria-label="다음 문장">▶▶</button>
    <label class="repeat" title="이 이야기: 한 편 반복 · 같은 모음: 탈무드/이솝 차례로 계속 · 전체: 모든 이야기 차례로 계속">반복
      <select id="repeat">
        <option value="off">안 함</option>
        <option value="one">이 이야기</option>
        <option value="group">같은 모음</option>
        <option value="all">전체</option>
      </select>
    </label>
    <label class="quality">목소리 품질
      <select id="steps">
        <option value="5">빠르게</option>
        <option value="8" selected>보통</option>
        <option value="12">좋게</option>
      </select>
    </label>
    <span id="progress" class="progress"></span>
  </nav>

  <dialog id="editor" class="editor">
    <form method="dialog" class="editor-form">
      <h2>내 이야기 넣기</h2>
      <label>제목 <input id="edTitle" required placeholder="예: 우리 집 강아지"></label>
      <label>이야기
        <textarea id="edBody" rows="12" required placeholder="여름 내내 개미는 부지런히 일했어요.&#10;베짱이: 개미야, 같이 노래나 부르자!&#10;개미: 겨울을 준비해야 해."></textarea>
      </label>
      <p class="hint">한 줄에 한 문장씩 적어 주세요. 인물의 말은 “이름: 말”로 적으면 인물마다 다른 목소리와 글씨 색으로 나와요. 이름이 없는 줄은 해설이 읽어요.</p>
      <div class="editor-actions">
        <button value="cancel" class="ghost" formnovalidate>닫기</button>
        <button id="edSave" value="save" class="solid">추가하기</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
