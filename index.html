<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>이야기 극장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="openShelf" class="shelf-btn" aria-controls="shelf" aria-expanded="false">📚 이야기 목록</button>
    <h1>이야기 극장</h1>
    <p id="engine" class="engine" aria-live="polite">음성 엔진 불러오는 중</p>
  </header>

  <div class="layout">
    <aside id="shelf" class="shelf" aria-label="이야기 목록과 재생목록">
      <div class="shelf-top">
        <strong>📚 이야기 목록</strong>
        <button id="closeShelf" class="shelf-close" aria-label="닫기">✕</button>
      </div>

      <section class="plist" aria-label="재생목록">
        <div class="plist-head">
          <h2>재생목록 <span id="plCount" class="count"></span></h2>
          <button id="plPlay" class="mini solid-mini" disabled>▶ 목록 재생</button>
          <button id="plClear" class="mini">비우기</button>
        </div>
        <ol id="playlist" class="playlist"></ol>
        <p id="plEmpty" class="hint">이야기 옆 ＋를 누르면 여기에 담겨요.</p>
        <div class="plist-add">
          <button class="mini" data-src="탈무드">탈무드 모두 담기</button>
          <button class="mini" data-src="이솝우화">이솝 모두 담기</button>
        </div>
      </section>

      <h2>이야기 고르기</h2>
      <ul id="storyList" class="story-list"></ul>
      <button id="openEditor" class="ghost">내 이야기 넣기</button>
    </aside>
    <div id="shelfBackdrop" class="backdrop" hidden></div>

    <main class="stage">
      <article id="page" class="page">
        <header class="page-head">
          <div id="scene" class="scene" role="img"></div>
          <div class="head-text">
            <p id="storySource" class="source"></p>
            <h2 id="storyTitle" class="title"></h2>
            <p id="castLegend" class="legend" aria-label="등장인물"></p>
            <details id="voices" class="voices">
              <summary>목소리 바꾸기</summary>
              <div id="castList" class="cast-list"></div>
            </details>
          </div>
        </header>

        <div id="book" class="book"></div>

        <nav class="pager" aria-label="쪽 넘기기">
          <button id="pgPrev" class="pg-btn">◀ 앞 쪽</button>
          <span id="pgNum" class="pg-num"></span>
          <button id="pgNext" class="pg-btn">다음 쪽 ▶</button>
        </nav>
        <p id="hint" class="hint-line" aria-live="polite"></p>
      </article>
    </main>
  </div>

  <nav class="transport" aria-label="재생 조작">
    <button id="prevBtn" class="tbtn" aria-label="이전 문장">◀◀</button>
    <button id="playBtn" class="tbtn play" aria-label="재생" disabled>▶</button>
    <button id="nextBtn" class="tbtn" aria-label="다음 문장">▶▶</button>
    <label class="repeat" title="반복 안 함: 재생목록을 끝까지 한 번 · 한 편 반복: 지금 이야기만 계속 · 목록 반복: 재생목록을 처음부터 다시">반복
      <select id="repeat">
        <option value="off">반복 안 함</option>
        <option value="one">한 편 반복</option>
        <option value="list">목록 반복</option>
      </select>
    </label>
    <label class="quality">목소리 품질
      <select id="steps">
        <option value="5">빠르게</option>
        <option value="8" selected>보통</option>
        <option value="12">좋게</option>
      </select>
    </label>
    <span id="progress" class="progress"></span>
  </nav>

  <dialog id="editor" class="editor">
    <form method="dialog" class="editor-form">
      <h2>내 이야기 넣기</h2>
      <label>제목 <input id="edTitle" required placeholder="예: 우리 집 강아지"></label>
      <label>이야기
        <textarea id="edBody" rows="12" required placeholder="여름 내내 개미는 부지런히 일했어요.&#10;베짱이: 개미야, 같이 노래나 부르자!&#10;개미: 겨울을 준비해야 해."></textarea>
      </label>
      <p class="hint">한 줄에 한 문장씩 적어 주세요. 인물의 말은 “이름: 말”로 적으면 인물마다 다른 목소리와 글씨 색으로 나와요. 이름이 없는 줄은 해설이 읽어요.</p>
      <div class="editor-actions">
        <button value="cancel" class="ghost" formnovalidate>닫기</button>
        <button id="edSave" value="save" class="solid">추가하기</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
